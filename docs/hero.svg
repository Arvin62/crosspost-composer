<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#e6ecf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1a2540" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <!-- 左侧文案 -->
  <g transform="translate(72, 96)">
    <text x="0" y="0" font-size="46" font-weight="800" fill="#16233c">图文排版台</text>
    <text x="0" y="52" font-size="21" font-weight="600" fill="#1668dc">一次插图，多平台粘贴</text>
    <text x="0" y="104" font-size="16" fill="#4a5568">本地图文排版工具 · 排好一次，复制粘贴到</text>
    <text x="0" y="130" font-size="16" fill="#4a5568">公众号 / 头条号 / 汽车之家，图文一次到位。</text>

    <g font-size="13.5" fill="#33415c">
      <g transform="translate(0, 168)">
        <rect x="0" y="-16" width="132" height="26" rx="13" fill="#ffffff" stroke="#d3ddec"/>
        <text x="16" y="2">WYSIWYG 插图</text>
      </g>
      <g transform="translate(146, 168)">
        <rect x="0" y="-16" width="120" height="26" rx="13" fill="#ffffff" stroke="#d3ddec"/>
        <text x="16" y="2">排版主题</text>
      </g>
      <g transform="translate(278, 168)">
        <rect x="0" y="-16" width="150" height="26" rx="13" fill="#ffffff" stroke="#d3ddec"/>
        <text x="16" y="2">Markdown 导入</text>
      </g>
      <g transform="translate(0, 204)">
        <rect x="0" y="-16" width="160" height="26" rx="13" fill="#ffffff" stroke="#d3ddec"/>
        <text x="16" y="2">样式内联 · 平台存活</text>
      </g>
      <g transform="translate(174, 204)">
        <rect x="0" y="-16" width="120" height="26" rx="13" fill="#ffffff" stroke="#d3ddec"/>
        <text x="16" y="2">纯本地运行</text>
      </g>
    </g>
  </g>

  <!-- 右侧应用界面 mockup -->
  <g transform="translate(628, 58)" filter="url(#shadow)">
    <rect x="0" y="0" width="512" height="324" rx="14" fill="#ffffff"/>
    <!-- 顶栏 -->
    <rect x="0" y="0" width="512" height="40" rx="14" fill="#ffffff"/>
    <rect x="0" y="26" width="512" height="14" fill="#ffffff"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#26282c">图文排版台</text>
    <rect x="368" y="12" width="60" height="18" rx="6" fill="#eef1f5"/>
    <rect x="434" y="12" width="62" height="18" rx="6" fill="#1668dc"/>
    <text x="443" y="25" font-size="11" fill="#ffffff">复制全文</text>
    <line x1="0" y1="40" x2="512" y2="40" stroke="#e4e6ea"/>
    <!-- 工具栏 -->
    <g font-size="11" fill="#40454d">
      <text x="20" y="61">正文</text>
      <text x="58" y="61">H2</text>
      <text x="88" y="61">H3</text>
      <text x="122" y="61" font-weight="700">B</text>
      <text x="146" y="61" font-style="italic">I</text>
      <text x="176" y="61">• 列表</text>
      <text x="410" y="61" fill="#9096a0">主题</text>
      <rect x="440" y="49" width="56" height="18" rx="5" fill="#ffffff" stroke="#d9dce1"/>
      <text x="449" y="61">简约</text>
    </g>
    <line x1="0" y1="74" x2="512" y2="74" stroke="#eceef1"/>
    <!-- 文章内容 -->
    <g transform="translate(36, 96)">
      <rect x="0" y="0" width="4" height="20" rx="2" fill="#1668dc"/>
      <text x="16" y="16" font-size="16" font-weight="700" fill="#1a1a1a">试驾体验</text>
      <rect x="0" y="34" width="440" height="8" rx="4" fill="#e8ebef"/>
      <rect x="0" y="50" width="410" height="8" rx="4" fill="#e8ebef"/>
      <!-- 图片 -->
      <rect x="60" y="72" width="320" height="96" rx="6" fill="#dfe6f0"/>
      <circle cx="120" cy="120" r="16" fill="#c2cede"/>
      <path d="M150 148 L200 108 L240 138 L300 96 L360 148 Z" fill="#c2cede"/>
      <!-- 引用 -->
      <rect x="0" y="184" width="440" height="34" rx="4" fill="#f6f8fa"/>
      <rect x="0" y="184" width="3" height="34" fill="#ccd2da"/>
      <rect x="16" y="197" width="300" height="8" rx="4" fill="#d5dbe3"/>
    </g>
  </g>

  <text x="72" y="392" font-size="12.5" fill="#8894a8">crosspost-composer · 个人非商业免费 · 商业使用需授权 · 零后端 · 数据只在本机</text>
</svg>
