name: Bug report
description: Report a reproducible Crosspost Composer problem without sharing private drafts
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Use synthetic text and images; do not attach unpublished articles, credentials, cookies, or private backups. Report security issues through the private link below instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, commit SHA, or the date you used the online version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on macOS 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: List exact steps using synthetic content that can be shared publicly.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: dropdown
    id: data_loss
    attributes:
      label: Did this involve possible data loss?
      options:
        - "No"
        - "Yes — I have kept a backup"
        - "Yes — I do not have a backup"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed unpublished content, personal data, and credentials from this report.
          required: true
